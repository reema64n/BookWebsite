<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Book</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 35px; }
        button { padding: 9px 15px; color: white; background: #b3261e; border: 0; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Delete Book</h1>
    <p>Are you sure you want to delete "<strong>{{ book.title }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url cancel_url_name %}">Cancel</a>
    </form>
</body>
</html>
