<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Lab 9 - Task 6</title></head>
<body>
<h1>Task 6: Books Matching Conditions per Publisher</h1>
<p>Conditions: price &gt; 50, quantity &lt; 5, and quantity &gt;= 1.</p>
<table border="1" cellpadding="8">
<tr><th>Publisher</th><th>Number of Matching Books</th></tr>
{% for publisher in publishers %}
<tr><td>{{ publisher.name }}</td><td>{{ publisher.matching_books_count }}</td></tr>
{% empty %}<tr><td colspan="2">No publishers found.</td></tr>{% endfor %}
</table>
</body></html>
