<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Lab 9 - Task 1</title></head>
<body>
<h1>Task 1: Books Availability</h1>
<p>Total quantity of all books: {{ total_quantity }}</p>
<table border="1" cellpadding="8">
<tr><th>Book</th><th>Quantity</th><th>Availability %</th></tr>
{% for book in books %}
<tr>
<td>{{ book.title }}</td>
<td>{{ book.quantity }}</td>
<td>{{ book.availability_percentage|floatformat:2 }}%</td>
</tr>
{% empty %}<tr><td colspan="3">No books found.</td></tr>{% endfor %}
</table>
</body></html>
