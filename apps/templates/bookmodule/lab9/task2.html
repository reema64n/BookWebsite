<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Lab 9 - Task 2</title></head>
<body>
<h1>Task 2: Total Book Stock per Publisher</h1>
<table border="1" cellpadding="8">
<tr><th>Publisher</th><th>Total Stock</th></tr>
{% for publisher in publishers %}
<tr><td>{{ publisher.name }}</td><td>{{ publisher.total_stock }}</td></tr>
{% empty %}<tr><td colspan="2">No publishers found.</td></tr>{% endfor %}
</table>
</body></html>
