<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Query Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; color: #222; }
        .container { max-width: 900px; margin: auto; }
        .book { padding: 12px 0; }
        h1 { margin-bottom: 24px; }
        hr { border: 0; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Book Query Results</h1>
        {% if books %}
            {% for obj in books %}
                <div class="book">
                    <strong>ID:</strong> {{ obj.id }}<br>
                    <strong>Title:</strong> {{ obj.title }}<br>
                    <strong>Author:</strong> {{ obj.author }}<br>
                    <strong>Price:</strong> {{ obj.price }}<br>
                    <strong>Edition:</strong> {{ obj.edition }}
                </div>
                <hr>
            {% endfor %}
        {% else %}
            <p>No books found.</p>
        {% endif %}
    </div>
</body>
</html>
